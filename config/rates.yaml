# ether.fi Cash cashback rates — SINGLE SOURCE OF TRUTH.
#
# WHY THIS FILE EXISTS
# An expired promo ("up to 15 % on food") was published as a current property
# of the card on 307 of 544 pages, under freshness stamps dated after it had
# ended, because nothing compared our numbers to the issuer's. The country list
# had such a comparison — scripts/availability-check.py — and the rates did not.
# This is the rates half of it.
#
# THE THREE-OUTCOME LAW, transplanted verbatim from availability.yaml:
#   tables match      -> bump `verified` to today. The date then means what it
#                        says: a check happened and it passed.
#   tables differ     -> write an alert, change NOTHING. A machine may notice a
#                        disagreement about a financial product; it may not
#                        decide what the new truth is.
#   unreachable /
#   unparseable       -> alert, change NOTHING, do NOT bump. "I could not read
#                        the page" must never be recorded as "nothing changed".
#
# NEVER copy these numbers from our own pages — they are the suspect.

source:
  url: "https://help.ether.fi/en/articles/262374-how-does-cashback-work"
  title: "How does cashback work? | ether.fi Help Center"
  parser: intercom_tables
  verified: "2026-08-23"

# Cells are read row-major from each level's table: three header cells, then
# (band, usd_rate, eur_rate) triples. The band text is compared verbatim,
# because a changed threshold is exactly the kind of drift this exists to
# catch — and a normalised comparison would hide a $2,000 -> $1,500 move.
levels:
  core:
    - band: "USD: First $2,000 / EUR: First $800"
      usd: "3%"
      eur: "3%"
    - band: "USD: $2,001 – $3,000 / EUR: $801 – $1,500"
      usd: "1%"
      eur: "1%"
    - band: "USD: Above $3,000 / EUR: Above $1,500"
      usd: "0.5%"
      eur: "0.1%"
  luxe:
    - band: "USD: First $10,000 / EUR: First $3,000"
      usd: "3%"
      eur: "3%"
    - band: "USD: $10,001 – $20,000 / EUR: $3,001 – $6,000"
      usd: "1%"
      eur: "1%"
    - band: "USD: Above $20,000 / EUR: Above $6,000"
      usd: "0.5%"
      eur: "0.1%"
  pinnacle:
    - band: "USD: First $50,000 / EUR: First $16,000"
      usd: "3%"
      eur: "3%"
    - band: "USD: $50,001 – $80,000 / EUR: $16,001 – $26,000"
      usd: "1%"
      eur: "1%"
    - band: "USD: Above $80,000 / EUR: Above $26,000"
      usd: "0.5%"
      eur: "0.1%"
  business:
    - band: "All spend"
      usd: "1%"
      eur: "0%"

# Category bonuses. The issuer's cashback article lists NONE, and the one that
# existed has lapsed. A promo row without `expires:` is a defect by definition:
# it has nowhere to fall out of date INTO, which is how the 15 % claim survived
# four months past its own end.
promos:
  - name: "food and dining bonus"
    rate: "15%"
    audience: "referred users (10% for organic sign-ups)"
    ran_from: "2026-01-01"
    expires: "2026-02-28"
    status: EXPIRED
    note: >
      May be stated ONCE, dated, on /reviews/ether-fi-cash-review/ because the
      query still gets searched. Anywhere else it is a false current claim.
