[pytest]
# Root suite: running `pytest` from /home/cryptocardhub covers every gate.
# `pytest` from inside video-generator/ still uses video-generator/pytest.ini,
# so the existing per-pipeline workflow is unchanged.
testpaths =
    video-generator/tests
    seo-site/tests
    scripts/tests
# export-public/ is a live public mirror (github.com/whiteknightonhorse/cryptocardhub-public,
# OPERATOR_ANSWERS.md 4.2), not a copy of this pipeline — its tests/ shares basenames with
# our own (test_partner_links.py, test_longform.py, ...) and `pytest .` (any invocation that
# ignores testpaths, e.g. `--collect-only` against the whole tree) fails on pytest's rootdir
# import-mismatch check before it ever reaches a real test. backups/ and node_modules/ are
# non-source trees pytest has no business walking either. See FLEET.md's ⛔-list.
norecursedirs = export-public backups node_modules .git
pythonpath = video-generator
addopts = -q
